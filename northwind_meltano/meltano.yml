version: 1
default_environment: dev
project_id: 2459e0cb-246c-4507-b57d-3e012610d72e
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      files:
      - entity: order_details
        path: ../data
        keys:
        - order_id
  - name: tap-postgres
    variant: meltanolabs
    pip_url: meltanolabs-tap-postgres
    config:
      user: northwind_user
      password: thewindisblowing
      host: localhost
      port: 5433
      database: northwind
      filter_schemas:
      - public
  - name: tap-csv--2
    inherit_from: tap-csv
    config:
      files:
      - entity: orders
        path: ../ext_data/date/csv/order_details.csv
        keys:
        - order_id
