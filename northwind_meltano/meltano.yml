  loaders:
  - name: target-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-csv.git
    config:
      output_path: ../ext_data/date/csv
      timestamp_format: '"%Y-%m-%d"'
      file_naming_scheme: '{stream_name}.csv'
  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres
    config:
      user: northwind_user
      password: thewindisblowing
      host: localhost
      port: 5433
      database: northwind
  - name: target-csv--postgres
    inherit_from: target-csv
    config:
      output_path: ../ext_data/date/postgres
      timestamp_format: '"%Y-%m-%d"'
      file_naming_scheme: '{stream_name}.csv'
